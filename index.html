<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#161719"><title>Film Lab Studio</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="brand">◉ <b>FILM LAB</b> <small>STUDIO</small></div><div class="actions"><button id="reset">リセット</button><button id="compare" title="押している間は元画像">比較（長押し）</button><button id="save" class="primary">JPEG保存</button></div></header><main><section class="viewer"><div id="drop" class="drop"><canvas id="preview"></canvas><div id="empty"><div class="camera">▧</div><h2>写真を読み込む</h2><p>クリック / ドラッグ＆ドロップ</p><p class="hint">JPEG・PNG・WebP（ブラウザが対応する画像）</p></div></div><div class="status"><span id="filename">画像未選択</span><span id="dimensions"></span></div><input id="file" type="file" accept="image/*" hidden></section><aside><h2>Film Simulation</h2><p class="note">実在フィルムの特徴を参考にした独自の近似表現です。公式プロファイルではありません。</p><div id="presets" class="presets"></div><h2>Creative Edit</h2><div class="sliders" id="sliders"></div><div class="bottom"><button id="restore">調整値を初期化</button><button id="presetSave">設定を書き出す</button><label class="import">設定を読み込む<input id="presetFile" type="file" accept="application/json,.json" hidden></label></div><p class="note">写真は外部に送信されません。処理はこの端末内で実行されます。</p></aside></main><script type="module" src="js/app.js"></script></body></html>
